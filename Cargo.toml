[package]
name = "spritx-terminal"
version = "0.0.1"
edition = "2021"
description = "SpritX — a GPUI terminal with built-in remote control"
license = "MIT"
authors = ["legacy7838-create"]
repository = "https://github.com/legacy7838-create/SpritX-terminal"
readme = "README.md"
keywords = ["terminal", "gpui", "pty", "remote"]
categories = ["gui", "command-line-utilities"]

[lib]
name = "spritx_terminal"
path = "src/lib.rs"

[[bin]]
name = "spritx-terminal"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
crypto_secretbox = "0.1"
futures-util = "0.3"
getrandom = "0.3"
gpui = "0.2.2"
image = { version = "0.25", default-features = false, features = ["png"] }
notify-rust = "4"
portable-pty = "0.9"
qrcode = { version = "0.14.1", default-features = false }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1", features = ["sync", "net", "rt-multi-thread", "macros", "io-util", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
toml = "0.8"
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }
url = "2.5.8"
vt100 = "0.18"

# xattr 0.2.3 references libc::ENOATTR, which current libc no longer exposes on
# Linux (it aliases ENODATA there). Required by GPUI's file-watcher stack.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }

[patch.crates-io]
xattr = { path = "vendor/xattr" }

# ---------------------------------------------------------------------------
# Packages. Both are built by .github/workflows/release.yml — `cargo deb` and
# `cargo generate-rpm` read these tables, so the workflow only has to call them.
# ---------------------------------------------------------------------------

[package.metadata.deb]
maintainer = "legacy7838-create <234553245+legacy7838-create@users.noreply.github.com>"
copyright = "2026, legacy7838-create"
license-file = ["LICENSE", "0"]
extended-description = """SpritX is a GPU-accelerated terminal emulator with built-in remote control.
Tabs and split panes, OSC 133 command blocks, a file tree with git status, rich
command history, and an end-to-end encrypted link that lets another SpritX or a
phone browser drive the same panes."""
section = "utils"
priority = "optional"
# $auto picks up the libraries the binary links against (libxcb, libxkbcommon,
# libxkbcommon-x11); Vulkan is loaded at runtime, so it has to be named.
depends = "$auto, libvulkan1"
assets = [
    ["target/release/spritx-terminal", "usr/bin/", "755"],
    ["packaging/spritx-terminal.desktop", "usr/share/applications/", "644"],
    ["assets/icon-256.png", "usr/share/icons/hicolor/256x256/apps/spritx-terminal.png", "644"],
    ["assets/icon-512.png", "usr/share/icons/hicolor/512x512/apps/spritx-terminal.png", "644"],
    ["README.md", "usr/share/doc/spritx-terminal/README.md", "644"],
]

[package.metadata.generate-rpm]
name = "spritx-terminal"
license = "MIT"
url = "https://github.com/legacy7838-create/SpritX-terminal"
summary = "GPU-accelerated terminal with built-in remote control"
assets = [
    { source = "target/release/spritx-terminal", dest = "/usr/bin/spritx-terminal", mode = "755" },
    { source = "packaging/spritx-terminal.desktop", dest = "/usr/share/applications/spritx-terminal.desktop", mode = "644" },
    { source = "assets/icon-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/spritx-terminal.png", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/spritx-terminal/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/spritx-terminal/LICENSE", mode = "644", doc = true },
]

# The sonames the binary needs are detected from the ELF header; Vulkan is
# dlopen()ed at runtime, so the loader has to be declared by hand.
[package.metadata.generate-rpm.requires]
vulkan-loader = "*"

# Incremental compilation combined with `opt-level > 0` hits a known
# LLVM/linker bug ("undefined hidden symbol: anon.…llvm…"). Disable it for the
# dev profile; a full rebuild of this crate is only ~30-60 s.
[profile.dev]
incremental = false

# `cargo run dev` uses the dev profile. Optimizing the dependency tree is the
# big one for a GPUI app: layout, text shaping and the whole wgpu render
# pipeline otherwise run completely unoptimized, which made a frame take
# ~26 ms (≈37 fps) and every click wait 10-15 ms. This is NOT a release build
# and debug info is kept for the app crate below, so breakpoints still work.
# The first build after this change rebuilds dependencies once (~8 min).
[profile.dev.package."*"]
opt-level = 2

# Keep this crate a little lighter than the deps so rebuilds stay fast.
[profile.dev.package.spritx-terminal]
opt-level = 1
