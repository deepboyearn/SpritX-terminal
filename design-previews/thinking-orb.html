<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SpritX — Thinking orb preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f0f2f4;color:#18181b;font-family:Inter,"Segoe UI",sans-serif}
input{position:absolute;width:1px;height:1px;opacity:0}
.page{max-width:1000px;margin:auto;padding:40px 28px}
header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}
h1{font-size:19px;line-height:1.4;letter-spacing:-.4px;margin:0;font-weight:600}
header p{margin:5px 0 0;font-size:13px;color:#62646b}
.controls{display:flex;gap:6px;align-items:center}
.control{padding:8px 12px;border-radius:8px;font-size:12px;color:#62646b;cursor:pointer;user-select:none}
#dark:checked~.page label[for=dark],#light:checked~.page label[for=light],#pause:checked~.page label[for=pause]{background:#fefefe;color:#18181b}
input:focus-visible~.page .controls{outline:2px solid #405eb0;outline-offset:3px;border-radius:10px}
.preview{--ground:#171717;--surface:#1a1a1a;--ink:#b8b8b8;--label:#999;--stroke:#ffffff08;--chrome:#101012;--tab:#232325;--muted:#838388;background:var(--ground);color:var(--ink);border-radius:18px;overflow:hidden}
#light:checked~.page .preview{--ground:#f0f2f4;--surface:#fefefe;--ink:#343438;--label:#626268;--stroke:#00000008;--chrome:#f0f2f4;--tab:#fefefe;--muted:#73737b}
.stage{min-height:340px;display:grid;place-items:center;padding:48px 24px}
.thinking-pill{display:inline-flex;align-items:center;justify-content:center;gap:15px;min-height:74px;padding:13px 24px 13px 14px;border:1px solid var(--stroke);border-radius:999px;background:var(--surface)}
.thinking-label{font-size:20px;font-weight:500;line-height:1;letter-spacing:-.6px;color:var(--label);white-space:nowrap}
.orb{--orb-size:44px;--dot-size:1px;--particle-size:1.65px;display:inline-block;position:relative;width:var(--orb-size);height:var(--orb-size);flex:none;vertical-align:middle;color:var(--ink);contain:layout}
.orb--inline{--orb-size:20px;--dot-size:1px;--particle-size:1.6px}
.orb-camera,.orb-sphere,.orb-plane,.orb-track{position:absolute;inset:0;transform-style:preserve-3d}
.orb-camera{transform:rotateX(17deg) rotateZ(-12deg)}
.orb-sphere{animation:orb-precess 17s linear infinite}
.orb-plane{transform:rotateY(var(--yaw)) rotateX(var(--tilt))}
.orb-track{animation:orb-turn var(--duration) linear infinite;animation-direction:var(--direction)}
.orb-dot{position:absolute;display:block;left:50%;top:50%;width:var(--dot-size);height:var(--dot-size);margin:calc(var(--dot-size)/-2);border-radius:50%;background:currentColor;opacity:var(--fade);transform:rotate(var(--angle)) translateX(var(--orbit-radius));}
/* Dot centers lie on a circle in each independent 3D orbital plane. */
.orb-plane{--orbit-radius:calc(var(--orb-size)*var(--radius-ratio))}
.orb-dot--particle{width:var(--particle-size);height:var(--particle-size);margin:calc(var(--particle-size)/-2)}
.orb--inline .orb-track{animation-duration:calc(var(--duration)*.48)}
@keyframes orb-turn{to{transform:rotateZ(360deg)}}
@keyframes orb-precess{to{transform:rotateY(360deg)}}
#pause:checked~.page .orb *{animation-play-state:paused}
.context{border-top:1px solid var(--stroke);padding:24px 28px 30px}
.context-caption{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 15px}
.workspace{background:var(--chrome);border-radius:12px;overflow:hidden;padding:8px 8px 0}
.tabs{display:flex;align-items:end;gap:8px;padding:0 8px}
.tab{display:flex;align-items:center;gap:9px;height:36px;padding:0 12px;min-width:164px;font-size:12px;position:relative}
.tab--active{background:var(--tab);border-radius:10px 10px 0 0}
.tab--inactive{color:var(--muted);min-width:136px}
.tab--inactive::before{content:"";position:absolute;inset:4px 0;border-radius:8px;background:var(--stroke)}
.tab>span,.tab>svg{position:relative}
.tab-name{flex:1;white-space:nowrap}
.terminal-icon{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.close,.plus{font-size:17px;color:var(--muted);font-weight:300}
.plus{padding:0 10px 8px}
.transcript{background:var(--tab);min-height:110px;border-radius:10px 10px 0 0;padding:22px 18px;font:12px/1.7 Consolas,monospace;color:var(--muted)}
.transcript strong{font-weight:400;color:var(--ink)}
footer{display:flex;justify-content:space-between;gap:16px;font-size:12px;color:#6b6d75;padding-top:18px;line-height:1.6}
@media(prefers-reduced-motion:reduce){.orb *{animation:none!important}}
@media(max-width:600px){.page{padding:24px 16px}header{align-items:start;flex-direction:column}.stage{min-height:290px}.context{padding:20px 12px}.tab{min-width:145px}.tab--inactive{min-width:112px}footer{flex-direction:column;gap:0}}
</style>
</head>
